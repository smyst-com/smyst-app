name: Versions-Autopilot (Profil-Verbesserung)

# Endlose, bewachte Verbesserungsschleife fuer published-Profile (4x/Tag):
# schlechteste Evals / Freshness-Bedarf zuerst -> Rebuild mit Version+1 ->
# QA-Gate -> Eval-Direktvergleich -> STAGING statt Livegang.
#
# Der Live-Tausch passiert ausschliesslich ueber die Freigabe im Admin-
# Cockpit (POST /api/admin/versions/...). Nichts wird geloescht, kein
# Statuswechsel — die Live-Capsule bleibt bis zur Freigabe unberuehrt.
#
# Mengen ohne Deploy konfigurierbar im Object Brain:
#   pipeline/autopilot/config.json  { "batch_per_run": 5, "daily_limit": 40 }

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max. Profile pro Lauf (leer = Config-Wert)"
        required: false
        default: ""

concurrency:
  group: version-autopilot
  cancel-in-progress: false

jobs:
  stage-versions:
    name: Versionen bauen + pruefen (staged)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend (inkl. Test-Extras)
        run: pip install -e ".[dev]"

      - name: "smyst 1.0: llama-server + Modell aus IDrive e2 laden"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          set -euo pipefail
          # llama-server: Asset-Namen enthalten die Build-Nummer — deshalb auf
          # einen bekannten Release gepinnt ('latest/download/llama-server-*.tar.gz'
          # existiert nicht; Lauf 32728191721 scheiterte an tar). Das Archiv
          # packt alles inkl. Shared Libs in ein Unterverzeichnis — deshalb
          # /opt/llama statt einzelne Binary nach /usr/local/bin.
          mkdir -p /opt/llama
          curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/b10606/llama-b10606-bin-ubuntu-x64.tar.gz \
            | tar -xz -C /opt/llama/
          LLAMA_BIN=$(find /opt/llama -type f -name llama-server | head -1)
          test -x "$LLAMA_BIN" || { echo "llama-server nicht im Archiv gefunden"; exit 1; }
          export LD_LIBRARY_PATH="$(dirname "$LLAMA_BIN"):${LD_LIBRARY_PATH:-}"
          # f16-Modell (988 MB) aus dem Object Brain — identischer Key wie im
          # Backend-Container (start-llm.sh, PR #515). $HOME statt /models:
          # Runner-Nutzer darf keine Root-Verzeichnisse anlegen (Lauf 32729543210).
          MODEL_DIR="$HOME/models"
          mkdir -p "$MODEL_DIR"
          MODEL="$MODEL_DIR/smyst-1.0.gguf"
          export MODEL
          python3 - <<'PY'
          import boto3
          from botocore.config import Config
          import os
          c = boto3.client(
              "s3",
              endpoint_url="https://s3.us-west-2.idrivee2.com",
              region_name="us-west-2",
              aws_access_key_id=os.environ["IDRIVE_E2_ACCESS_KEY"],
              aws_secret_access_key=os.environ["IDRIVE_E2_SECRET_KEY"],
              config=Config(read_timeout=900, retries={"max_attempts": 10}),
          )
          # Q4_K_M bevorzugt (~350 MB, auf CPU ~2-3x schneller als f16 —
          # mehr QA-Kandidaten pro 90-min-Job); f16 als Fallback.
          candidates = [
              ("models/smyst-1.0/2026-08-20/smyst-1.0-Q4_K_M.gguf", "Q4_K_M"),
              ("models/smyst-1.0/2026-08-20/smyst-1.0-f16.gguf", "f16"),
          ]
          for key, label in candidates:
              try:
                  c.head_object(Bucket="smyst-memories", Key=key)
              except Exception:
                  print(f"{label} nicht in e2 — naechster Kandidat.")
                  continue
              c.download_file("smyst-memories", key, os.environ["MODEL"])
              print(f"Modell geladen: {label} ({key})")
              break
          else:
              raise SystemExit("Weder Q4_K_M noch f16 in e2 gefunden.")
          PY
          # Mehr Kerne statt 1 Thread (Zeabur-Container) — das war der Grund,
          # warum smyst_llm im Backend stets ins 20-s-Timeout lief. ABER: ein
          # Kern bleibt frei — saettigt llama-server alle vCPUs, verhungert der
          # Runner-Agent und kann das 90-min-Timeout nicht abarbeiten; der Lauf
          # wandert als Zombie ueber die Zeit und blockiert die Concurrency-
          # Gruppe (14:36-Uhr-Lauf 24.08.: 100+ min statt 90, manueller Cancel).
          THREADS=$(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
          nohup "$LLAMA_BIN" \
            --model "$MODEL" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 2048 --parallel 2 --threads "$THREADS" \
            > /tmp/llama-server.log 2>&1 &
          echo "$LLAMA_BIN" > /tmp/llama_bin_path
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "llama-server bereit (threads=$THREADS)."
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health > /dev/null || {
            echo "llama-server nicht gestartet:"; tail -20 /tmp/llama-server.log; exit 1;
          }

      - name: "Versions-Autopilot: Rebuild + QA + Eval-Vergleich (Staging)"
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # EIGENES MODELL zuerst (Auftrag Inhaber 25.08.: kein Geld an Provider):
          # smyst_llm laeuft als llama-server lokal im Runner; ohne SMYST_LLM_API_KEY
          # wuerde der Router den Provider ueberspringen (siehe pipeline-scale-2k.yml).
          LLM_PROVIDER_ORDER: "smyst_llm,groq,smyst_gateway"
          SMYST_LLM_BASE_URL: "http://127.0.0.1:8080/v1"
          SMYST_LLM_API_KEY: "smyst"
          LLM_PROVIDER_TIMEOUT_SECONDS: "240"
          SMYST_GATEWAY_BASE_URL: "https://api.smyst.com/api/ci/llm"
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          python -m app.workers.version_autopilot --enabled $ARGS
