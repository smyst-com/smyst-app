name: Provider-Health (Fruehwarnung)

# Vorfall 24.08.2026: Provider-Keys fielen ueber Tage still aus (DeepSeek 402,
# OpenRouter 403, Anthropic/Gemini/xAI 400) — die Pipeline brach erst zusammen,
# als ALLE tot waren. Dieser Watchdog pingt stuendlich alle Provider
# (Credential-Check, keine Generierungskosten) und alarmiert frueh:
# weniger als 2 gesunde Provider => rotes Label auf dem Alarm-Issue.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: provider-health
  cancel-in-progress: false

jobs:
  health:
    name: Provider pingen + Alarm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # issues:write fuer Alarm-Issue + Label (Vorfall 24.08.: ohne dieses
      # Recht scheiterte gh issue create still an 'provider-outage' not found).
      issues: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: "Provider-Health-Check (alle konfigurierten Provider anpingen)"
        id: health
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
        run: |
          # bash -e (Runner-Default) wuerde bei Worker-Exit 2 abbrechen, BEVOR
          # der Exit-Code als Output landet — deshalb set +e rund um den Aufruf.
          set +e
          python -m app.workers.provider_health > /tmp/health.json
          EXIT=$?
          set -e
          cat /tmp/health.json
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"

      - name: "Alarm: GitHub-Issue bei Provider-Krise"
        if: steps.health.outputs.exit == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SUMMARY=$(cat /tmp/health.json | tail -1)
          # Label idempotent anlegen (Lektion vom Quality-Autopilot-Vorfall).
          gh label create provider-outage --color d93f0b --description "Weniger als 2 LLM-Provider erreichbar" 2>/dev/null || true
          TITLE="🚨 Provider-Alarm: Pipeline in Gefahr"
          ISSUE=$(gh issue list -R "$REPO" --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create -R "$REPO" -t "$TITLE" -l provider-outage -b "$(date -u +%F) — $SUMMARY

            Bitte pruefen: API-Keys (Ungueltigkeit 400), Credits (402), Limits (403/429). Der Versions-Autopilot und die Pipeline verwerfen solange alle Kandidaten."
          else
            gh issue comment -R "$REPO" "$ISSUE" -b "$(date -u +%F) — $SUMMARY"
          fi

      - name: "Entwarnung: Alarm-Issue schliessen, wenn wieder gesund"
        if: steps.health.outputs.exit != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="🚨 Provider-Alarm: Pipeline in Gefahr"
          ISSUE=$(gh issue list -R "$REPO" --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue close -R "$REPO" "$ISSUE" -c "Entwarnung $(date -u +%F): Provider wieder ausreichend erreichbar."
          fi
