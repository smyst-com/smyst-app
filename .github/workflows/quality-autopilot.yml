name: Quality-Autopilot

# Autopilot Nr. 2 (Master-Plan): laeuft taeglich automatisch, fuehrt den
# Chat-Qualitaets-Eval aus und erstellt/aktualisiert ein GitHub-Issue mit dem
# Ergebnis. Faellt die Quote unter 90 %, wird das Issue als Regression
# markiert (Label quality-regression) – das ist der Trigger fuer den
# Fix-Zyklus (Dislike-Analyse -> Fix -> Eval-Vergleich).

on:
  schedule:
    - cron: "30 3 * * *" # taeglich 03:30 UTC (nach dem Eval-Lauf um 03:15)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  quality-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Eval-Lauf
        env:
          LLM_PROVIDER_ORDER: ${{ secrets.LLM_PROVIDER_ORDER }}
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -o pipefail
          python scripts/run_eval.py 2>/dev/null | tail -20 > /tmp/eval_summary.txt
          cat /tmp/eval_summary.txt

      - name: Regression erkennen
        id: check
        run: |
          LINE=$(grep -oP 'Bestanden: \d+ \(\d+%\)' /tmp/eval_summary.txt | grep -oP '\d+(?=%)' | head -1)
          RATE=${LINE:-0}
          echo "rate=$RATE" >> "$GITHUB_OUTPUT"
          if [ "$RATE" -lt 90 ]; then echo "regression=true" >> "$GITHUB_OUTPUT"; else echo "regression=false" >> "$GITHUB_OUTPUT"; fi

      - name: Qualitaets-Issue aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="🤖 Quality-Autopilot: Tagesbericht Chat-Qualität"
          BODY="$(date -u +%F) — $(cat /tmp/eval_summary.txt)"
          # Labels idempotent anlegen — fehlende Labels liessen den Bericht
          # drei Tage still scheitern (22.-24.08.2026, 'quality-autopilot' not found).
          gh label create quality-autopilot --color 5e9ad6 2>/dev/null || true
          gh label create quality-regression --color d93f0b 2>/dev/null || true
          ISSUE=$(gh issue list -R "$REPO" --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE" ]; then
            gh issue create -R "$REPO" -t "$TITLE" -b "$BODY" -l "quality-autopilot"
          else
            gh issue comment -R "$REPO" "$ISSUE" -b "$BODY"
          fi
          if [ "${{ steps.check.outputs.regression }}" = "true" ]; then
            gh issue edit -R "$REPO" "$ISSUE" --add-label "quality-regression" || true
          fi
