name: Cost-Pilot

# Autopilot 17: Woechentlicher LLM-Kostenbericht (OpenRouter-Guthaben
# via offizielle Credits-API). Read-only; der Bericht wird als
# kommentiertes Issue (Label cost-report) abgelegt, damit Trends
# sichtbar bleiben. Groq/Piper laufen im Free-Tier und werden nur
# erwaehnt. Alarm bei weniger als $5 Restguthaben.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  cost-report:
    name: LLM-Kostenbericht OpenRouter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: OpenRouter-Guthaben abfragen
        id: credits
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsS --max-time 20 -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/credits)
          echo "$RESP"
          TOTAL=$(printf '%s' "$RESP" | jq -r '.data.total_credits // empty')
          USED=$(printf '%s' "$RESP" | jq -r '.data.total_usage // empty')
          if [ -z "$TOTAL" ] || [ -z "$USED" ]; then
            echo "Antwort enthaelt keine credits-Daten — Key ohne Abrechnung oder API geaendert." >&2
            echo "remaining=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMAINING=$(jq -n --argjson t "$TOTAL" --argjson u "$USED" '$t - $u')
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "used=$USED" >> "$GITHUB_OUTPUT"
      - name: Bericht als Issue kommentieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMAINING: ${{ steps.credits.outputs.remaining }}
          TOTAL: ${{ steps.credits.outputs.total }}
          USED: ${{ steps.credits.outputs.used }}
        run: |
          gh label create "cost-report" --color 1d76db --description "Cost-Pilot: woechentlicher LLM-Kostenbericht" 2>/dev/null || true
          DATE=$(date -u '+%Y-%m-%d')
          if [ "$REMAINING" = "unknown" ]; then
            BODY="OpenRouter-Credits-API lieferte am ${DATE} keine Zahlen (Key ohne Abrechnung oder API geaendert). Pruefen."
            TITLE="LLM-Kostenbericht ${DATE} (ohne Zahlen)"
          else
            BODY="OpenRouter-Stand ${DATE}: Restguthaben \$${REMAINING} (aufgeladen \$${TOTAL}, verbraucht \$${USED}). Groq und Piper-TTS laufen im Free-Tier."
            TITLE="LLM-Kostenbericht ${DATE}: \$${REMAINING} Restguthaben"
          fi
          OPEN=$(gh issue list --label cost-report --state open --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --title "$TITLE" --label cost-report --body "$BODY"
            NUMBER=$(gh issue list --label cost-report --state open --json number --jq '.[0].number')
          else
            NUMBER=$(gh issue list --label cost-report --state open --json number --jq '.[0].number')
            gh issue comment "$NUMBER" --body "$BODY"
          fi
          # Alarm-Schwelle: weniger als $5 Restguthaben
          if [ "$REMAINING" != "unknown" ] && jq -e '. < 5' <<<"$REMAINING" >/dev/null; then
            gh issue comment "$NUMBER" --body "WARNUNG: Restguthaben unter 5 USD — Aufladung pruefen (nur Inhaber entscheidet, AGENTS.md Rote Linien)."
          fi
