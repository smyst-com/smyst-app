name: Secret-Pilot

# Autopilot 16: Gitleaks-Scan gegen den kompletten Verlauf bei jedem
# Push/PR (nur geaenderte Commits) und woechentlich alles (letzte 90
# Tage). Read-only; Funde werden als Issue (Label secret-leak)
# gemeldet. Rotierung von Keys macht ausschliesslich der Inhaber.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  gitleaks:
    name: Gitleaks-Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks ausfuehren
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Issue bei Leak (idempotent)
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "secret-leak" --color e99695 --description "Secret-Pilot: moeglicher geleakter Key im Repo" 2>/dev/null || true
          OPEN=$(gh issue list --label secret-leak --state open --json number --jq 'length')
          BODY="Gitleaks hat im Lauf $(date -u '+%Y-%m-%d %H:%M UTC') (Event: ${GITHUB_EVENT_NAME}) einen moeglichen Secret-Leak gefunden. Details im Workflow-Log. KEINE automatische Bereinigung: Key widerrufen und rotieren (nur Inhaber), dann Verlauf bereinigen und Issue schliessen."
          if [ "$OPEN" = "0" ]; then
            gh issue create --title "Möglicher Secret-Leak im Repository ($(date -u '+%Y-%m-%d'))" --label secret-leak --body "$BODY"
          else
            NUMBER=$(gh issue list --label secret-leak --state open --json number --jq '.[0].number')
            gh issue comment "$NUMBER" --body "Weiterer Gitleaks-Fund: $(date -u '+%Y-%m-%d %H:%M UTC') (Event: ${GITHUB_EVENT_NAME})"
          fi
