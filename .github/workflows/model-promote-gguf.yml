name: smyst 1.1 → GGUF (Pipeline-Format)

# Bringt das trainierte smyst-1.1 in die Profil-Pipeline:
# 1. Q4_K_M-GGUF aus dem GitHub-Release v-smyst-1.1-gguf laden
#    (konvertiert vom Trainings-Mac: convert_hf_to_gguf b10606 + Q4_K_M;
#    Quelle ~/smyst-train/fused/smyst-1.1-v4, Qwen2ForCausalLM)
# 2. Qualitaets-Tor: llama-server starten, Test-Prompt muss sinnvoll antworten
# 3. Upload nach e2: models/smyst-1.0/2026-08-25/smyst-1.1-Q4_K_M.gguf
# Danach: pipeline-scale-2k.yml bevorzugt diese Datei (Fallback smyst-1.0).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-promote-gguf
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
      IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: llama.cpp-Tools (Release b10606, wie pipeline-scale-2k)
        run: |
          mkdir -p /opt/llama
          curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/b10606/llama-b10606-bin-ubuntu-x64.tar.gz \
            | tar -xz -C /opt/llama/
          find /opt/llama -name llama-server | head -1

      - name: GGUF aus dem GitHub-Release laden (32 Teile -> zusammensetzen)
        run: |
          gh release download v-smyst-1.1-gguf --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp --clobber --pattern 's11p*'
          ANZAHL=$(ls /tmp/s11p* | wc -l)
          echo "Teile empfangen: $ANZAHL (erwartet 32)"
          test "$ANZAHL" -eq 32
          cat /tmp/s11p00 /tmp/s11p01 /tmp/s11p02 /tmp/s11p03 /tmp/s11p04 /tmp/s11p05 \
              /tmp/s11p06 /tmp/s11p07 /tmp/s11p08 /tmp/s11p09 /tmp/s11p10 /tmp/s11p11 \
              /tmp/s11p12 /tmp/s11p13 /tmp/s11p14 /tmp/s11p15 /tmp/s11p16 /tmp/s11p17 \
              /tmp/s11p18 /tmp/s11p19 /tmp/s11p20 /tmp/s11p21 /tmp/s11p22 /tmp/s11p23 \
              /tmp/s11p24 /tmp/s11p25 /tmp/s11p26 /tmp/s11p27 /tmp/s11p28 /tmp/s11p29 \
              /tmp/s11p30 /tmp/s11p31 > /tmp/smyst-1.1-Q4_K_M.gguf
          echo '4d90051d53c7a47333622cabf1d6a1575c3a8b99bee369fb9cb2eaec2b56eac1  /tmp/smyst-1.1-Q4_K_M.gguf' | sha256sum -c -
          test -s /tmp/smyst-1.1-Q4_K_M.gguf
          ls -la /tmp/smyst-1.1-Q4_K_M.gguf

      - name: Qualitaets-Tor — llama-server starten, Test-Prompt muss antworten
        run: |
          BIN_DIR=$(dirname $(find /opt/llama -name llama-server | head -1))
          export LD_LIBRARY_PATH="$BIN_DIR"
          nohup "$BIN_DIR/llama-server" \
            --model /tmp/smyst-1.1-Q4_K_M.gguf \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 2048 --threads 2 > /tmp/llama-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health > /dev/null || {
            echo 'llama-server kam nicht hoch:'; tail -20 /tmp/llama-server.log; exit 1; }
          ANTWORT=$(curl -sf http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Sag kurz Hallo auf Deutsch."}],"max_tokens":30}')
          echo "Test-Antwort: $ANTWORT"
          echo "$ANTWORT" | grep -qi 'hallo\|gruss\|grüß' || {
            echo 'Modell antwortet nicht sinnvoll'; exit 1; }

      - name: Nach e2 hochladen
        working-directory: backend
        run: |
          pip install -q boto3
          python3 << 'PY'
          import boto3
          from botocore.config import Config
          import os

          c = boto3.client(
              's3',
              endpoint_url='https://s3.us-west-2.idrivee2.com',
              region_name='us-west-2',
              aws_access_key_id=os.environ['IDRIVE_E2_ACCESS_KEY'],
              aws_secret_access_key=os.environ['IDRIVE_E2_SECRET_KEY'],
              config=Config(read_timeout=900, retries={'max_attempts': 10}),
          )
          BUCKET = 'smyst-memories'
          key = 'models/smyst-1.0/2026-08-25/smyst-1.1-Q4_K_M.gguf'
          lokal = '/tmp/smyst-1.1-Q4_K_M.gguf'
          groesse = os.path.getsize(lokal)
          print(f'hochladen: {lokal} ({groesse/1e6:.0f} MB) -> {key}')
          c.upload_file(lokal, BUCKET, key)
          head = c.head_object(Bucket=BUCKET, Key=key)
          assert head['ContentLength'] == groesse, 'Groessen-Mismatch nach Upload!'
          print(f'verifiziert: {key} ({head["ContentLength"]} Bytes)')
          print('FERTIG — Pipeline kann smyst-1.1 jetzt laden.')
          PY
