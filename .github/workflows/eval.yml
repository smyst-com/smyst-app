name: Chat-Qualitaets-Eval

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  schedule:
    # Taeglich 03:15 UTC: Eval gegen die live konfigurierten Provider
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit- und Regressionstests
        run: pytest -q

      - name: Eval-Lauf (Regel-Checks + LLM-Judge wenn Keys vorhanden)
        # Provider-Keys nur ausserhalb von pull_request: PR-Code koennte die
        # Env ausspuelen (Supply-Chain-Fix 28.09.2026). PRs laufen mit
        # Unit-/Regressionstests; der volle Eval laeuft auf push/schedule.
        if: github.event_name != 'pull_request'
        env:
          LLM_PROVIDER_ORDER: ${{ secrets.LLM_PROVIDER_ORDER }}
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/run_eval.py

      - name: Eval-Report als Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: eval-report
          path: backend/evals/reports/*.json
          retention-days: 90
