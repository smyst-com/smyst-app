name: Autopilot-Health

# Health-Check des 5.000-Profile-Tagesautopiloten (14.09.2026).
#
# Read-only: liest Tagesquoten + Trichter aus den Status-Markern im Object
# Brain (pipeline_stats, LIST-Aggregationen) und prueft die letzten Läufe der
# Autopilot-Workflows. Schreibt NUR eine Run-Summary und — bei echtem
# Stillstand — EIN Alarm-Issue (autopilot-stalled). Entwarnung schliesst das
# Issue automatisch. Der Health-Check selbst dispatcht NICHTS: das Heilen ist
# Sache des Watchdogs (Selbst-Takt + Quota-Eskalation), damit Diagnose und
# Therapie getrennt bleiben.

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pipeline-health
  cancel-in-progress: true

jobs:
  health:
    name: "Quota + Trichter + Takt"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backend installieren (fuer pipeline_stats)
        run: pip install -e "backend/."

      - name: "Tagesquoten + Trichter lesen"
        id: quota
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          AUTOPILOT_DAILY_TARGET: "5000"
        run: |
          python -m app.workers.pipeline_stats --save > /tmp/stats.json
          python - <<'PY'
          import json, os
          stats = json.load(open('/tmp/stats.json'))
          q, t, totals = stats.get('quota', {}), stats.get('today', {}), stats.get('totals', {})
          lines = [
              f"### Autopilot-Health (UTC {stats.get('day')})",
              f"- Veroeffentlicht heute: **{q.get('published_today')}** / {q.get('target')} ({q.get('reached_percent')}%) — offen {q.get('remaining')}",
              f"- Heute neu: reviewed {t.get('reviewed', 0)} · generated {t.get('generated', 0)} · rejected {t.get('rejected', 0)}",
              f"- Bestand: candidate {totals.get('candidate')} · researched {totals.get('researched')} · verified {totals.get('verified')} · generated {totals.get('generated')} · reviewed {totals.get('reviewed')} · published {totals.get('published')}",
          ]
          print("\n".join(lines))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          with open('/tmp/quota.env', 'w') as f:
              f.write(f"PUBLISHED_TODAY={q.get('published_today', 0)}\n")
              f.write(f"REMAINING={q.get('remaining', 0)}\n")
          PY
          cat /tmp/quota.env >> "$GITHUB_OUTPUT"

      - name: "Letzte Autopilot-Läufe"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            for WF in pipeline-scale-2k.yml pipeline-scale-2k-lane-b.yml pipeline-run.yml pipeline-publish.yml; do
              AGE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=1" \
                --jq '(now - (.workflow_runs[0].created_at | fromdateiso8601)) | floor' 2>/dev/null || echo 999999)
              echo "- Letzter Start ${WF}: vor $((AGE / 60)) min"
              if [ "${AGE}" -gt 10800 ]; then
                echo "  - WARNUNG: seit $((AGE / 60)) min nicht mehr gestartet"
              fi
            done
          } | tee /tmp/runs.txt >> "$GITHUB_STEP_SUMMARY"

      - name: "Object-Brain-Schreibzugriff testen (e2-Probe)"
        id: access
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          pip install --quiet boto3
          python scripts/e2_access_probe.py --json > /tmp/access.json
          cat /tmp/access.json
          python - <<'PY'
          import json, os
          report = json.load(open('/tmp/access.json'))
          blocked = report.get('write_blocked', False)
          with open('/tmp/access.env', 'w') as f:
              f.write(f"E2_WRITE_BLOCKED={'1' if blocked else '0'}\n")
          head = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          if blocked:
              head.write("### ALARM: Object-Brain-Schreibzugriff blockiert (e2)\n")
              head.write("Der Autopilot kann NICHTS speichern (PUT abgelehnt). Nur im IDrive-e2-Konto des Inhabers behebbar: Bucket-Kontingent pruefen oder Schluessel-Berechtigung (Read/Write) wiederherstellen. Alle Leseoperationen funktionieren; keine Datenverloren — nach Freigabe läuft die Kette automatisch weiter.\n")
          else:
              head.write("- Object-Brain-Schreibzugriff: OK\n")
          head.close()
          PY
          cat /tmp/access.env >> "$GITHUB_OUTPUT"

      - name: "Stillstand: Alarm-Issue oeffnen/aktualisieren"
        env:
          GH_TOKEN: ${{ github.token }}
          E2_WRITE_BLOCKED: ${{ steps.access.outputs.E2_WRITE_BLOCKED }}
        run: |
          set -euo pipefail
          source /tmp/quota.env 2>/dev/null || true
          PUBLISHED_TODAY="${PUBLISHED_TODAY:-0}"
          REMAINING="${REMAINING:-5000}"
          AGE_SCALE_A=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-scale-2k.yml/runs?per_page=1" --jq '(now - (.workflow_runs[0].created_at | fromdateiso8601)) | floor')
          AGE_SCALE_B=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-scale-2k-lane-b.yml/runs?per_page=1" --jq '(now - (.workflow_runs[0].created_at | fromdateiso8601)) | floor')
          AGE_RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-run.yml/runs?per_page=1" --jq '(now - (.workflow_runs[0].created_at | fromdateiso8601)) | floor')
          STALLED=1
          if [ "${E2_WRITE_BLOCKED:-0}" = "1" ]; then STALLED=1; fi
          if [ "${REMAINING}" -le 0 ]; then STALLED=0; fi
          YOUNGEST=$(( AGE_SCALE_A < AGE_SCALE_B ? AGE_SCALE_A : AGE_SCALE_B ))
          if [ "${YOUNGEST}" -lt 5400 ] && [ "${E2_WRITE_BLOCKED:-0}" != "1" ]; then STALLED=0; fi
          if [ "${AGE_RUN}" -lt 7200 ] && [ "${E2_WRITE_BLOCKED:-0}" != "1" ]; then STALLED=0; fi
          TITLE="Autopilot steht still — Tagesziel 5000/Tag gefaehrdet"
          ISSUE=$(gh issue list -R "$GITHUB_REPOSITORY" --search "autopilot-stalled in:title" --state open --json number --jq '.[0].number')
          if [ "${STALLED}" -eq 1 ]; then
            BODY="$(date -u +%F' %T') — Quota offen: ${REMAINING} (heute publiziert: ${PUBLISHED_TODAY}). Letzte Starts (s): scale-2k=${AGE_SCALE_A}, lane-b=${AGE_SCALE_B}, run=${AGE_RUN}. Watchdog eskaliert automatisch; hier keine Aktion noetig, solange die Eskalationen greifen."
            if [ -z "${ISSUE}" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" -t "autopilot-stalled: ${TITLE}" -l pipeline -b "${BODY}"
            else
              gh issue comment -R "$GITHUB_REPOSITORY" "${ISSUE}" -b "${BODY}"
            fi
            echo "ALARM: Stillstand erkannt."
          else
            if [ -n "${ISSUE}" ]; then
              gh issue close -R "$GITHUB_REPOSITORY" "${ISSUE}" -c "Entwarnung $(date -u +%F' %T'): Autopilot arbeitet wieder (heute publiziert: ${PUBLISHED_TODAY}, offen ${REMAINING})."
            fi
            echo "Autopilot-Takt in Ordnung."
          fi
