name: Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  free-only-policy:
    name: Free-only production policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate static sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate free-only production surface
        run: python3 scripts/validate-foundation.py

      - name: Validate profile memory contract
        run: python3 scripts/check-profile-memory-contract.py

  security-freeze-guard:
    name: Security freeze guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate security hardening markers (PR #869)
        run: python3 scripts/check-security-freeze-guard.py

  root-app:
    name: Root app type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint:tsc

      - name: Build static PWA artifact
        run: npm run build

      - name: Validate static PWA artifact
        run: sh scripts/check-dist-artifact.sh
