name: Quality-Loop (Evals + Freshness)

# Qualitaetsschleife (PR #303), ausgelagert aus pipeline-run.yml (04.08.2026):
# Evals, Freshness-Check und Quality-Report liefen bisher am Ende jedes
# Pipeline-Crons und verlaengerten den Publish-Lauf. Seit dem QA-Performance-
# Fix ist der Pipeline-Lauf kurz — die Qualitaetsschleife laeuft jetzt
# unabhaengig 2x taeglich mit entsprechend hoeheren Limits (2x80 Evals,
# 2x200 Freshness ≈ bisheriges Tagesvolumen bei 8 Crons).
#
# Read-only gegenueber Status/Publish: Evals schreiben nur eval_report/
# eval_history, Freshness setzt nur refresh.needs_review. Kein Deploy noetig.

on:
  schedule:
    - cron: "47 5,17 * * *"
  workflow_dispatch:

concurrency:
  group: quality-loop
  cancel-in-progress: false

jobs:
  quality:
    name: Qualitaetsschleife
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # actions:read fuer die Tagesbilanz (Liste der heutigen Pipeline-Laeufe).
      actions: read
      # id-token:write fuer den Ausweis beim CI-LLM-Gateway.
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend (inkl. Test-Extras)
        run: pip install -e ".[dev]"

      - name: "Evals: published-Profile (Qualitaetsschleife)"
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # 07.08.2026: Gemini/DeepSeek/Anthropic/xAI ergaenzt — die Keys lagen
          # ungenutzt in den Repo-Secrets, waehrend Groq-429 + OpenRouter-402 +
          # OpenAI-429 die QA in den Not-Fallback zwangen (alle Kandidaten
          # fielen durch, 1-5 publiziert/Lauf statt ~200).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER_ORDER: "groq,smyst_llm,smyst_gateway"
          SMYST_GATEWAY_BASE_URL: "https://api.smyst.com/api/ci/llm"
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
        run: python -m app.workers.eval_profiles --enabled --limit 40

      - name: "Freshness: Quellen-Check published-Profile"
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: python -m app.workers.refresh_profiles --enabled --limit 200

      - name: "Quality-Report: Zusammenfassung fuer Admin-Sicht"
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: python -m app.workers.report_quality

      # Tagesbilanz (04.08.2026): Soll 1000+ publizierte Profile/Tag. Am 04.08.
      # fielen 5 von 7 Cron-Laeufen still aus (QA-Timeout vor PR #324) — das
      # fiel erst beim manuellen Nachrechnen auf. Diese Bilanz macht Ist-Zahl
      # und abgebrochene Laeufe in der Run-Summary sichtbar.
      - name: "Tagesbilanz: Live-Profile + Pipeline-Laeufe heute"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIVE=$( (curl -sf https://smyst.com/sitemap.xml | grep -o '<loc>https://smyst.com/t/' || true) | wc -l | tr -d ' ')
          TODAY=$(date -u +%Y-%m-%d)
          {
            echo "### Tagesbilanz ${TODAY}"
            echo "- Live-Profile (Sitemap /t/): **${LIVE}** — Soll-Zuwachs: 2000/Tag"
            echo "- Pipeline-Laeufe heute (Soll: 8, alle success):"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-run.yml/runs?created=${TODAY}&per_page=20" \
              --jq '.workflow_runs[] | "  - \(.created_at) \(.conclusion // .status)"'
          } >> "$GITHUB_STEP_SUMMARY"
