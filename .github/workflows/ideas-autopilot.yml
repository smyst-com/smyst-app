name: Ideen-Autopilot

# Autopilot Stufe 3: schlaegt woechentlich 1-3 kleine Verbesserungen vor,
# basierend auf Qualitaets-Report, Kritik-Feedbacks und smyst-1.0-Modell-Evals.
# Die Ideen landen als Freigabe-Karten im Admin-Bereich (/admin -> Ideen);
# NICHTS geht ohne menschliche Freigabe live.

on:
  schedule:
    - cron: "0 9 * * 0" # sonntags 09:00 UTC (11:00 Berlin, vor dem Retraining)
  workflow_dispatch:

permissions:
  contents: read
  # id-token:write fuer das CI-LLM-Gateway (erster Provider, kein Key noetig)
  id-token: write

jobs:
  generate-ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ideen generieren
        env:
          SMYST_GATEWAY_BASE_URL: https://api.smyst.com/api/ci/llm
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          LLM_PROVIDER_ORDER: ${{ secrets.LLM_PROVIDER_ORDER }}
          LLM_DEFAULT_MODELS: ${{ secrets.LLM_DEFAULT_MODELS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m app.workers.generate_ideas --limit 3
