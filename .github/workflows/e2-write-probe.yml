name: e2 Write-Probe (Diagnose)

# Diagnose: Testet LIST / HEAD / PUT / DELETE gegen das Object Brain und
# zeigt blockierte Schreibzugriffe sofort (Vorfall 13.09.2026 ~23:30 UTC:
# bucket-weit PUT AccessDenied + HEAD 403, LIST/GET OK — Ursache im
# e2-Konto: Kontingent oder Schluessel-Rechte, Konsole des Inhabers).
# Schreibt nur winzige Probe-Objekte und loescht sie wieder (wenn erlaubt).
# Nur manuell per workflow_dispatch startbar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: "Zugriffsprobe"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          pip install --quiet boto3
          python scripts/e2_access_probe.py

      - name: "Autopilot-Freigabe-Diagnose (nur lesend)"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          pip install --quiet boto3
          python scripts/e2_autopilot_diagnose.py
