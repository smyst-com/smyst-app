name: Android App Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build-Typ"
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_CANONICAL_HOST: https://smyst.com
          VITE_API_BASE_URL: https://smyst-api.zeabur.app
          VITE_API_FALLBACK_BASE_URL: https://api.smyst.com
          VITE_AUTH_BASE_URL: https://smyst-api.zeabur.app/auth

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB (unsigniert)
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: smyst-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: smyst-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
