name: Profil-Doktor (Bestands-Qualität 24/7)

# Profil-Autopilot fuer den BESTAND (Auftrag Inhaber 15.09.2026): rotiert
# dauerhaft durch ALLE veröffentlichten Profile, prueft jedes einzeln und
# regelmaessig und ergaenzt fehlende Geburts-/Sterbeorte, Lebensdaten und
# ehrliche Anzeige-Labels — nur soweit aus gesicherten Quellen (Wikidata-
# Snapshots, Wikipedia-Texte) zuverlaessig ermittelbar. Das EIGENE Modell
# (smyst-1.1, llama-server auf dem Runner) extrahiert Orte aus den Quelltexten,
# wenn Wikidata nichts hergibt — mit Anti-Halluzinations-Gate (Ort muss im
# Text stehen). Nie Loeschen, nie Unpublish, nie Statuswechsel.
#
# Nach jedem Lauf: Selbsttest der geschriebenen Daten im Worker, Pages-Deploy
# nur bei Änderungen (mit Ping-Pong-Guard), danach Live-Pruefung der
# geaenderten Profilseiten + Chat-Gesundheitscheck (providers?ping=true).
# keep-takt verkettet die Laeufe, falls GitHub-Crons wieder ausfallen.

on:
  schedule:
    # stuendlich zur Minute 37 (off-peak); voller Rotationsumlauf ueber den
    # Bestand (~27.000 Profile bei Limit 250) in ~4,5 Tagen.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Profile je Lauf (Rotation)"
        required: false
        default: "250"
      only_incomplete:
        description: "true = nur Profile mit fehlenden Orts-/Datumsfeldern (Nachhol-Modus)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      extraction_budget:
        description: "max. Eigene-Modell-Extraktionen je Lauf"
        required: false
        default: "120"
      dry_run:
        description: "true = Vorschau: prueft und berichtet, schreibt NICHTS (kein Deploy, kein Smoke)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: profile-doctor
  cancel-in-progress: false

jobs:
  doctor:
    name: Profil-Doktor Lauf
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend (inkl. Test-Extras)
        run: pip install -e ".[dev]"

      # Schnelles Gate vor jedem Lauf: die Doctor-Suite muss gruen sein.
      - name: Doctor-Tests
        run: python -m pytest tests/test_profile_doctor.py -q

      - name: "Eigenes Modell: llama-server + smyst-1.1 (GitHub-Release, e2 nur Rueckfallebene)"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Identische, in pipeline-scale-2k live erprobte Prozedur: Binary aus
          # dem gepinnten llama.cpp-Release, Modell aus 32 Release-Teilen.
          mkdir -p /opt/llama
          curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/b10606/llama-b10606-bin-ubuntu-x64.tar.gz \
            | tar -xz -C /opt/llama/
          LLAMA_BIN=$(find /opt/llama -type f -name llama-server | head -1)
          test -x "$LLAMA_BIN" || { echo "llama-server nicht im Archiv gefunden"; exit 1; }
          export LD_LIBRARY_PATH="$(dirname "$LLAMA_BIN"):${LD_LIBRARY_PATH:-}"
          MODEL_DIR="$HOME/models"
          mkdir -p "$MODEL_DIR"
          MODEL="$MODEL_DIR/smyst-1.0.gguf"
          RELEASE_OK=true
          curl -fsSL --retry 2 "https://github.com/smyst-com/smyst-app/releases/download/v-smyst-1.1-gguf/s11p00" -o "$MODEL.part" || RELEASE_OK=false
          if [ "$RELEASE_OK" = "true" ]; then
            mv "$MODEL.part" "$MODEL"
            for i in $(seq -w 1 31); do
              curl -fsSL --retry 3 --retry-delay 5 \
                "https://github.com/smyst-com/smyst-app/releases/download/v-smyst-1.1-gguf/s11p$i" \
                >> "$MODEL" || { RELEASE_OK=false; break; }
            done
            if [ "$RELEASE_OK" = "true" ] && [ "$(stat -c%s "$MODEL" 2>/dev/null || echo 0)" -gt 900000000 ]; then
              echo "Modell aus GitHub-Release zusammengesetzt (kein e2-Egress)."
            else
              RELEASE_OK=false
            fi
          fi
          if [ "$RELEASE_OK" != "true" ]; then
            echo "GitHub-Release nicht vollstaendig — Rueckfallebene: e2-Download."
            rm -f "$MODEL" "$MODEL.part"
            python3 - <<'PY'
          import boto3
          from botocore.config import Config
          import os
          c = boto3.client(
              "s3",
              endpoint_url="https://s3.us-west-2.idrivee2.com",
              region_name="us-west-2",
              aws_access_key_id=os.environ["IDRIVE_E2_ACCESS_KEY"],
              aws_secret_access_key=os.environ["IDRIVE_E2_SECRET_KEY"],
              config=Config(read_timeout=900, retries={"max_attempts": 10}),
          )
          candidates = [
              ("models/smyst-1.0/2026-08-25/smyst-1.1-Q4_K_M.gguf", "smyst-1.1 Q4_K_M"),
              ("models/smyst-1.0/2026-08-20/smyst-1.0-Q4_K_M.gguf", "Q4_K_M"),
          ]
          for key, label in candidates:
              try:
                  c.head_object(Bucket="smyst-memories", Key=key)
              except Exception:
                  continue
              c.download_file("smyst-memories", key, os.environ["MODEL"])
              print(f"Modell geladen: {label} ({key})")
              break
          else:
              raise SystemExit("Kein Modell in e2 gefunden.")
          PY
          fi
          # Ein Kern bleibt frei (Runner-Agent), wie in scale-2k live gelernt.
          THREADS=$(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
          nohup "$LLAMA_BIN" \
            --model "$MODEL" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --parallel 1 --threads "$THREADS" \
            > /tmp/llama-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "llama-server bereit (threads=$THREADS)."
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health > /dev/null || {
            echo "llama-server nicht gestartet:"; tail -20 /tmp/llama-server.log; exit 1;
          }

      - name: "Profil-Doktor ausfuehren"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          SMYST_LLM_BASE_URL: "http://127.0.0.1:8080/v1"
          SMYST_LLM_API_KEY: "smyst"
          LLM_PROVIDER_TIMEOUT_SECONDS: "240"
        run: |
          set -o pipefail
          ARGS=(--enabled --limit "${{ inputs.limit || '250' }}" \
                --extraction-budget "${{ inputs.extraction_budget || '120' }}" \
                --summary-file /tmp/doctor-summary.md \
                --changed-file /tmp/doctor-changed.txt)
          if [ "${{ inputs.only_incomplete || 'false' }}" = "true" ]; then
            ARGS+=(--only-incomplete)
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m app.workers.profile_doctor "${ARGS[@]}" | tee /tmp/doctor-out.log
          CHANGED=$( (wc -l < /tmp/doctor-changed.txt 2>/dev/null) | tr -d ' ' )
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then CHANGED=0; fi
          echo "changed=${CHANGED:-0}" >> "$GITHUB_OUTPUT"
          # Schreibzeitpunkt: Die Nachpruefung darf nur auf Deploys pruefen,
          # die NACH diesem Moment gestartet sind (ein vorher gestarteter
          # Pages-Lauf enthaelt die neuen/geaenderten Slugs noch nicht —
          # Befund 17:48-Lauf 15.09.: 'charles-frederic-kreube' 404).
          echo "write_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
        id: doctor

      - name: Lauf-Zusammenfassung
        if: always()
        run: |
          if [ -f /tmp/doctor-summary.md ]; then
            cat /tmp/doctor-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Nur bei echten Aenderungen deployen (Ping-Pong-Guard wie in pipeline-run).
      - name: "Pages-Deploy anstossen (nur bei Aenderungen)"
        if: steps.doctor.outputs.changed != '0' && steps.doctor.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AKTIV=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/github-pages.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "pending" or .status == "queued" or .status == "waiting")] | length')
          if [ "${AKTIV}" -gt 0 ]; then
            echo "Deploy bereits aktiv/queued (${AKTIV}) — Dispatch uebersprungen."
          else
            gh workflow run github-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
            sleep 20
          fi

      # Nachpruefung: gewarteter Pages-Lauf + geaenderte Profilseiten live
      # abrufen + Chat-Gesundheitscheck (providers?ping=true).
      # Scharf geprueft wird NUR gegen einen Pages-Lauf, der NACH dem
      # Schreibzeitpunkt gestartet UND erfolgreich beendet ist. Deploy-Stau
      # ist KEIN Doktor-Fehler: Daten liegen sicher im Store; solange kein
      # frischer Deploy existiert/beendet ist, wird gewarnt und der nächste
      # Stundenlauf prueft wieder.
      - name: "Nachpruefung: Profilseiten + Chat"
        if: steps.doctor.outputs.changed != '0' && steps.doctor.outputs.changed != ''
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          WRITE_EPOCH=${{ steps.doctor.outputs.write_epoch }}
          RUN_ID=""; SEKUNDEN=0; STATUS="unknown"; START_EPOCH=0
          # Bis zu 30 min auf einen Deploy warten, der NACH dem Schreiben startet.
          while [ "$SEKUNDEN" -lt 1800 ]; do
            READOUT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/github-pages.yml/runs?per_page=5" \
              --jq '[.workflow_runs[] | select(.run_started_at)] | sort_by(.run_started_at) | reverse | .[0] | "\(.id) \(.run_started_at)"')
            RUN_ID=$(echo "$READOUT" | cut -d' ' -f1)
            START_EPOCH=$(date -d "$(echo "$READOUT" | cut -d' ' -f2)" +%s 2>/dev/null || echo 0)
            if [ "$START_EPOCH" -gt "$WRITE_EPOCH" ]; then break; fi
            RUN_ID=""; sleep 30; SEKUNDEN=$((SEKUNDEN+30))
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::Kein nach dem Schreiben gestarteter Pages-Lauf (Deploy-Stau) — Live-Check übersprungen; Daten sind im Store, nächste Stunde wird geprüft."
            exit 0
          fi
          echo "Frischer Pages-Lauf ${RUN_ID} — warte bis zu 30 min auf Abschluss ..."
          SEKUNDEN=0; STATUS="unknown"
          while [ "$SEKUNDEN" -lt 1800 ]; do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')
            [ "$STATUS" = "completed" ] && break
            sleep 30; SEKUNDEN=$((SEKUNDEN+30))
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::warning::Pages-Lauf nach 30 min nicht beendet (Deploy-Stau) — Live-Check übersprungen; Daten sind im Store, nächste Stunde wird geprüft."
            exit 0
          fi
          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::warning::Pages-Lauf endete mit '${CONCLUSION}' — Live-Check übersprungen."
            exit 0
          fi
          FEHLER=0
          for slug in $(head -10 /tmp/doctor-changed.txt); do
            OK=0
            for versuch in 1 2 3; do
              API=$(curl -sf -o /dev/null -w '%{http_code}' "https://smyst.com/api/public/twins/${slug}/" || true)
              SEITE=$(curl -sf -o /dev/null -w '%{http_code}' "https://smyst.com/t/${slug}/" || true)
              if [ "$API" = "200" ] && [ "$SEITE" = "200" ]; then OK=1; break; fi
              echo "Versuch ${versuch}: ${slug} API ${API}, Seite ${SEITE} — warte 30 s (CDN-Nachlauf) ..."
              sleep 30
            done
            echo "${slug}: API ${API}, Seite ${SEITE}"
            [ "$OK" = "0" ] && FEHLER=$((FEHLER+1))
          done
          PING=$(curl -sf "https://api.smyst.com/api/ai/providers?ping=true" || true)
          echo "$PING" | head -c 400; echo
          # Pflicht-Smoke (Autopilot-Freeze): smyst_llm muss ok:true liefern.
          cat > /tmp/check_ping.py <<'PYEOF'
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              raise SystemExit("providers-Ping unlesbar")
          entry = next((p for p in data.get("providers", []) if p.get("provider") == "smyst_llm"), None)
          ok = bool(entry and (entry.get("ping") or {}).get("ok"))
          if not ok:
              print("::warning::smyst_llm-Ping ohne ok:true — Chat-Rueckfallebene pruefen.")
          else:
              print("smyst_llm ok — Chat-Kette gesund.")
          PYEOF
          echo "$PING" | python3 /tmp/check_ping.py
          if [ "$FEHLER" -gt 0 ]; then
            echo "::error::${FEHLER} geaenderte Profilseiten sind nach erfolgreichem Deploy nicht erreichbar."
            exit 1
          fi
          echo "Alle geprueften Profilseiten erreichbar."

  # Selbst-Takt (bewaehrt aus pipeline-scale-2k): jede abgeschlossene Kette
  # stoesst den naechsten Lauf selbst an, falls GitHub-Crons in der Nacht
  # wieder um Stunden ausfallen. Neuervergleich verhindert Doppel-Ketten.
  keep-takt:
    name: Takt halten
    needs: doctor
    # Ein Vorschau-Lauf (dry_run) startet keine neue Kette — der Stunden-Cron
    # und laufende Ketten bleiben unberuehrt.
    if: ${{ always() && inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: "Naechsten Lauf anstossen, wenn kein jüngerer existiert"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/profile-doctor.yml/runs?per_page=10")
          NEWER=$(echo "$RUNS" | jq --argjson me "${RUN_ID}" \
            '[.workflow_runs[] | select(.id > $me and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "action_required"))] | length')
          LAST_CONCLUSION=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion != null)][0].conclusion // "none"')
          LAST_START_AGO=$(echo "$RUNS" | jq '[.workflow_runs[] | (now - (.created_at | fromdateiso8601))] | min')
          echo "Neuere laufende Laeufe: ${NEWER}; letztes Ergebnis: ${LAST_CONCLUSION} vor ${LAST_START_AGO}s"
          if [ "${NEWER}" -ne 0 ]; then
            echo "Jüngerer Lauf existiert (Cron oder Kette) — nichts zu tun."
            exit 0
          fi
          if [ "${LAST_CONCLUSION}" = "failure" ] && [ "${LAST_START_AGO}" -lt 1800 ]; then
            echo "Letzter Lauf fehlerhaft und jünger als 30 min — Cooldown, keine Kette."
            exit 0
          fi
          gh workflow run profile-doctor.yml --ref main --repo "${GITHUB_REPOSITORY}"
          echo "### Selbst-Takt: naechsten Profil-Doktor-Lauf gestartet" >> "$GITHUB_STEP_SUMMARY"
