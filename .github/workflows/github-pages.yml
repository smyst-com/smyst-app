name: GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  # false statt true: Bei parallelen Agenten-Pushes wurden Deploy-Läufe
  # wiederholt abgebrochen, bevor sie fertig waren (kein Deploy landete mehr).
  # Läufe queue'n sich jetzt sequenziell — der letzte Stand gewinnt.
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 29.08.: 60 -> 300 — der Union-Restore (18.875 Profile) spiegelt tausende Bilder im Merge-Schritt
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_CANONICAL_HOST: https://smyst.com
          VITE_API_BASE_URL: https://smyst-api.zeabur.app
          VITE_API_FALLBACK_BASE_URL: https://api.smyst.com
          VITE_AUTH_BASE_URL: https://smyst-api.zeabur.app/auth
          VITE_AUTH_FALLBACK_BASE_URL: https://api.smyst.com/auth

      - name: Preserve custom domain
        run: echo "smyst.com" > dist/CNAME

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Prerender legal routes with real 200 status
        run: |
          for route in privacy imprint terms trust; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Redirect German legal aliases
        run: |
          for pair in impressum:imprint datenschutz:privacy agb:terms; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            mkdir -p "dist/$src"
            printf '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/%s/"><link rel="canonical" href="https://smyst.com/%s/"><meta name="robots" content="noindex"><title>smyst.com</title><script>location.replace("/%s/")</script></head><body></body></html>' "$dst" "$dst" "$dst" > "dist/$src/index.html"
          done

      - name: Prerender public profile pages
        run: node scripts/generate-profile-pages.mjs
        env:
          VITE_CANONICAL_HOST: https://smyst.com

      # Autopilot-Pipeline: menschlich freigegebene Profile aus IDrive e2 laden.
      # Fehlt der Index (noch nichts publiziert), ist das ein No-op.
      - name: Fetch published pipeline profiles (optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          aws s3 cp s3://smyst-memories/pipeline/published/index.json pipeline-published-index.json \
            --endpoint-url https://s3.us-west-2.idrivee2.com --region us-west-2 2>s3-index-err.log \
            || { if grep -Eq "\(404\)|NoSuchKey|Not Found" s3-index-err.log; then echo "Kein Publish-Index in IDrive e2 (ok, noch nichts publiziert)."; else cat s3-index-err.log; echo "::error::Publish-Index nicht lesbar (z.B. AccessDenied) — Abbruch, sonst geht die Site OHNE die bereits publizierten Pipeline-Profile live (Vorfall 30.07.2026, Deploys #360/#361)."; exit 1; fi; }

      # FAQ-Antworten pro Profil (SEO, 21.08.): die QA der Autopilot-Pipeline
      # erzeugt fuer jedes Profil fuenf individuelle Antworten (bisher nur
      # Trainingsmaterial). Als FAQPage-JSON-LD auf den Profilseiten sind sie
      # einmaliger, substanzieller Inhalt pro Seite — Googles Scaled-Content-
      # Regeln (Maerz 2026) verlangen genau das. Datei fehlt -> Build laeuft
      # ohne FAQ weiter (tolerant, kein Silent-Wipe-Thema: nur Zusatzcontent).
      - name: Fetch profile FAQ answers (optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          aws s3 cp s3://smyst-memories/pipeline/published/qa-answers.json pipeline-qa-answers.json             --endpoint-url https://s3.us-west-2.idrivee2.com --region us-west-2             || echo "Keine FAQ-Antworten in e2 (ok — Seiten ohne FAQ-Schema)."

      # Egress-Sparer (Vorfall 31.07.2026: 10-GB-Frei-Egress von IDrive e2
      # aufgebraucht, alle e2-Zugriffe gesperrt, Deploys/Pipeline rot): die
      # gespiegelten Profilbilder zwischen Builds im kostenlosen GitHub-
      # Actions-Cache halten. Der e2-Sync unten laedt dann nur noch NEUE
      # Bilder (wenige MB) statt aller ~1000 Bilder (~600 MB) pro Build.
      # key ist pro Lauf eindeutig, damit am Job-Ende immer der aktuelle
      # Stand gesichert wird; restore-keys zieht den juengsten Treffer.
      - name: Restore profile image cache (GitHub Actions)
        uses: actions/cache@v4
        with:
          path: dist/public/profile-images
          key: profile-images-${{ github.run_id }}
          restore-keys: |
            profile-images-

      # Bild-Cache aus dem Object Brain (IDrive e2) vorladen: Commons drosselt
      # Serien-Downloads, deshalb zieht jeder Build nur noch die NEUEN Bilder.
      # Fehlt der Ordner (erster Lauf), ist das ein No-op.
      - name: Restore mirrored profile images from IDrive e2 (optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          mkdir -p dist/public/profile-images
          aws s3 sync s3://smyst-memories/profile-images/ dist/public/profile-images/ \
            --endpoint-url https://s3.us-west-2.idrivee2.com --region us-west-2 --only-show-errors \
            || { echo "::error::Bild-Cache nicht lesbar (z.B. AccessDenied) — Abbruch, sonst gehen Profilseiten ohne gespiegelte Bilder live (leerer Prefix ist fuer sync kein Fehler)."; exit 1; }
          echo "Bilder im Cache: $(ls -1 dist/public/profile-images 2>/dev/null | wc -l)"

      # Ausgemusterte Altbilder (Freigabe Adam 06.08.2026): euklid.jpg zeigte
      # das Rathaus von Euclid/Ohio, julius-caesar.jpg hatte ungeklaerte
      # Foto-Lizenz. Beide sind seit PR #353 nirgends mehr referenziert,
      # kommen aber ueber Actions-Cache und e2-Spiegel zurueck in dist.
      # Dieser Schritt haelt sie dauerhaft aus der Auslieferung heraus.
      - name: Remove retired profile images
        run: rm -fv dist/public/profile-images/euklid.jpg dist/public/profile-images/julius-caesar.jpg

      # Katalog-Felder-Waechter: der Katalog enthaelt nur noch die Felder, die
      # die Listen-Ansichten lesen (37,2 -> 9,1 MB). Nimmt jemand in
      # publicProfileToStartTwin/isCompletePublicProfile ein weiteres Feld dazu,
      # ohne CATALOG_FIELDS zu ergaenzen, waere es live undefined — Profile
      # fielen still aus der Liste. Laeuft VOR dem Merge, damit der Fehler
      # auffaellt, bevor ein kaputter Katalog gebaut wird.
      - name: Check catalog fields (Startseite liest nur Vorhandenes)
        run: node scripts/check-catalog-fields.mjs

      - name: Merge published pipeline profiles
        run: node scripts/merge-pipeline-published.mjs
        env:
          VITE_CANONICAL_HOST: https://smyst.com

      # Dubletten-Wächter (Befund 29.07.2026, Atatürk doppelt): bricht den
      # Deploy ab, wenn zwei Profile nach Normalisierung (Diakritika +
      # Umschrift ue/oe/ae/ss) denselben Namen oder Slug tragen.
      - name: Check twin duplicates (deploy gate)
        run: node scripts/check-twin-duplicates.mjs

      # Bild-Diät (Performance-Audit 21.08.): Ausreißer bis 1,67 MB (Kant,
      # Bach) werden im Grid mit ~104 px dargestellt. Alles über 300 KB wird
      # auf max 512 px verkleinert und als JPEG q82 neu kodiert; kleinere
      # Dateien bleiben unberührt (idempotent — bereits komprimierte Bilder
      # fallen unter die Schwelle und werden nicht erneut kodiert, Quality-
      # Verluste durch Wiederholung sind ausgeschlossen). ImageMagick ist auf
      # ubuntu-latest vorinstalliert.
      # Pillow statt ImageMagick: mogrify ist auf ubuntu-latest NICHT
      # vorinstalliert (Deploy 32432444735 rot, 21.08.) — pip install ist in
      # Sekunden erledigt und der Resize reines Python.
      - name: Shrink oversized profile images
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          grenze = 300 * 1024
          grosse = [p for p in glob.glob("dist/public/profile-images/*.jpg")
                    + glob.glob("dist/public/profile-images/*.jpeg")
                    + glob.glob("dist/public/profile-images/*.JPG")
                    + glob.glob("dist/public/profile-images/*.JPEG")
                    if os.path.getsize(p) > grenze]
          print(f"Bilder ueber 300 KB: {len(grosse)}")
          for pfad in grosse:
              try:
                  with Image.open(pfad) as bild:
                      bild.thumbnail((512, 512), Image.LANCZOS)
                      # JPEG kann Palette- (P) und CMYK-Modi nicht direkt speichern
                      if bild.mode not in ("RGB", "L"):
                          bild = bild.convert("RGB")
                      bild.save(pfad, "JPEG", quality=82, optimize=True)
              except Exception as fehler:  # noqa: BLE001
                  print(f"  uebersprungen {pfad}: {fehler}")
          print("Diaet fertig.")
          PY

      # Schwund-Waechter (Vorfall 30.07.2026, Deploys #360/#361): der Schritt
      # oben faengt nur den TOTALausfall des Publish-Index ab. Ein halb
      # geschriebener Index oder ein fehlgeschlagener Merge ergibt dagegen einen
      # gruenen Build mit hunderten Profilen weniger — und die verschwinden
      # still von der Live-Seite. Dieses Gate vergleicht den gebauten Katalog
      # mit dem live ausgelieferten und bricht bei mehr als 5 % Schwund ab.
      # Ist die Live-Seite nicht erreichbar, laeuft es bewusst durch.
      # Gewollter Massen-Unpublish: Lauf mit ALLOW_PROFILE_DROP=1 wiederholen.
      - name: Check profile count (deploy gate gegen stillen Schwund)
        run: node scripts/check-profile-count-guard.mjs

      # Neu gespiegelte Bilder zurueck in den Cache. Nur hinzufuegen, niemals
      # loeschen (kein --delete): bestehende Bilder bleiben unangetastet.
      - name: Persist mirrored profile images to IDrive e2 (optional)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          aws s3 sync dist/public/profile-images/ s3://smyst-memories/profile-images/ \
            --endpoint-url https://s3.us-west-2.idrivee2.com --region us-west-2 --only-show-errors \
            || echo "Bild-Cache konnte nicht geschrieben werden (ok) — naechster Build spiegelt erneut."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
