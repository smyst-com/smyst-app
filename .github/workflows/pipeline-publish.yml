name: Pipeline Auto-Publish

# Publiziert QA-freigegebene Kandidaten (reviewed + qa_passed) live.
#
# EIGENER Workflow mit EIGENER Concurrency-Gruppe (24./25.08.2026): Der
# Publish Schritt steckte bisher in pipeline-run.yml (Gruppe 'main') und
# wurde wiederholt von langlaufenden run-small-Zombies verdraengt —
# Profile lagen stundenlang reviewed im Store, ohne live zu gehen.
#
# Freigabe-Basis: Pauschal-Freigabe Adam King 2026-07-04/17, approved_by
# wird im Audit-Trail dokumentiert. QA-Gate unveraendert: publish_profiles
# publiziert ausschliesslich qa_passed reviewed-Kandidaten. Tagesdeckel
# 2500 (dokumentierter Betreiber-Deckel, pipeline-run.yml).

on:
  workflow_dispatch:
    inputs:
      approved_by:
        description: "Freigabe-E-Mail (Audit-Trail)"
        required: true
        default: "smyst247@gmail.com"
      publish_limit:
        description: "Tageslimit (dokumentierter Deckel 5000/Tag, Anweisung Betreiber 05.09.2026)"
        required: false
        # 2500 -> 5000 (14.09.2026): Der Watchdog-Dispatch lief noch mit dem
        # alten 2500er Deckel — beim Tagesziel 5000 haette er die Haelfte
        # unbegricht gelassen, obwohl der Cron-Pfad in pipeline-run.yml
        # bereits mit 5000 laeuft. QA-Gate unangetastet.
        default: "5000"
      qids:
        description: "Optional: kommagetrennte QIDs — nur diese publizieren"
        required: false
        default: ""

permissions:
  contents: read
  # Der Deploy-nach-Publish-Schritt dispatcht github-pages.yml — ohne
  # actions: write wirft der Dispatch HTTP 403 (Run 33247971460).
  actions: write

concurrency:
  group: pipeline-publish
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish reviewed"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: "Publish (nur mit dokumentierter Freigabe)"
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          if [ -z "${{ inputs.approved_by }}" ]; then
            echo "Publish erfordert approved_by (Freigabe-E-Mail)."; exit 2
          fi
          LIMIT_ARGS=""
          if [ -n "${{ inputs.publish_limit }}" ]; then
            LIMIT_ARGS="--daily-limit ${{ inputs.publish_limit }}"
          fi
          if [ -n "${{ inputs.qids }}" ]; then
            for qid in $(echo "${{ inputs.qids }}" | tr ',' ' '); do
              python -m app.workers.publish_profiles publish --qid "$qid" \
                --approved-by "${{ inputs.approved_by }}" --enabled $LIMIT_ARGS
            done
          else
            python -m app.workers.publish_profiles publish --all-reviewed \
              --approved-by "${{ inputs.approved_by }}" --enabled $LIMIT_ARGS
          fi

      # Tagesstatistik (14.09.2026): Nach JEDEM Publish in der Run-Summary
      # sichtbar machen, wie viele Profile HEUTE (UTC) live gegangen sind und
      # wie weit das 5000er-Tagesziel bedient ist. Read-only LIST-Aggregation,
      # keine Voll-Scans. Fehler blockieren den Deploy-Pfad nicht.
      - name: "Tages-Statistik in Run-Summary"
        if: always()
        continue-on-error: true
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          python -m app.workers.pipeline_stats --save > /tmp/stats.json
          python - <<'PY'
          import json, os
          stats = json.load(open('/tmp/stats.json'))
          q = stats.get('quota', {})
          t = stats.get('today', {})
          line1 = f"### Tages-Statistik (UTC {stats.get('day')})"
          line2 = f"- Heute veroeffentlicht: **{q.get('published_today')}** / Ziel {q.get('target')} ({q.get('reached_percent')}%)"
          line3 = f"- Heute neu: reviewed {t.get('reviewed', 0)}, generated {t.get('generated', 0)}, rejected {t.get('rejected', 0)}"
          line4 = f"- Bestand: published {stats.get('totals', {}).get('published')}, reviewed {stats.get('totals', {}).get('reviewed')}, generated {stats.get('totals', {}).get('generated')}"
          print("\n".join([line1, line2, line3, line4]))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join([line1, line2, line3, line4]) + "\n")
          PY

      # Neue Profile live stellen SOFORT nach dem Publish — nicht erst beim
      # naechsten 3h-Cron (GitHub liess Cron-Slots wiederholt komplett aus;
      # Vorfall 29.08.: 75 Profile lagen 3+ Stunden unveraendert im Store).
      - name: "Deploy nach Publish (nur wenn keiner laeuft/wartet)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy-Pingpong-Falle (06.09.): Jeder neue Dispatch cancellt den
          # vorherigen PENDING-Deploy — bei Triggern schneller als der
          # Buildzeit (1-3h) wurde NIE einer fertig und die live-Zahl
          # verhungerte. Guard: nur dispatchen, wenn kein Deploy aktiv.
          AKTIV=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/github-pages.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "pending" or .status == "queued" or .status == "waiting")] | length')
          if [ "${AKTIV}" -gt 0 ]; then
            echo "Deploy bereits aktiv/queued (${AKTIV}) — Dispatch uebersprungen."
          else
            gh workflow run github-pages.yml --ref main --repo "${GITHUB_REPOSITORY}"
            echo "Deploy nach Publish angeusstossst." >> "$GITHUB_STEP_SUMMARY"
          fi
