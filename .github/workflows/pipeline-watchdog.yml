name: Pipeline-Watchdog

# GitHub-Crons fallen unter Last ersatzlos aus (05.08.2026: Slot 01:23 fehlte,
# 06.08. wieder — je ausgefallenem Slot fehlen bis zu ~250 Profile am Tag).
# Dieser Watchdog prueft stuendlich, ob im letzten ~3h-Fenster ein Pipeline-
# Lauf gestartet wurde, und holt den Slot sonst per Dispatch nach
# (mode=run-small mit watchdog=true — publiziert und deployt wie ein Cron-Lauf;
# die Pauschal-Freigabe Adam King 2026-07-04/17 deckt alle Automatik-Laeufe).
#
# Der Watchdog ist selbst ein Cron und kann ebenfalls ausfallen — bei 24
# Chancen/Tag ist ein verpasster Pipeline-Slot trotzdem nach spaetestens
# ~1h nachgeholt. Doppel-Dispatches sind unkritisch: die Concurrency-Gruppe
# von pipeline-run serialisiert, und ein Lauf ohne frische Kandidaten ist
# nach ~25 min Overhead fertig.

on:
  schedule:
    # Alle 15 Minuten: prueft (a) den klassischen Pipeline-Takt und (b) die
    # Scale-2k-Pipeline. Dichter Takt, weil GitHub-Crons unter Last ausfallen
    # und Scale-2k-Laeufe durch den 90-min-Timeout abgebrochen werden koennen.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Slot-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Fehlt ein Pipeline-Lauf im 3h-Fenster? Dann nachholen."
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 170 min = Cron-Abstand (180) minus Toleranz; zaehlt JEDEN Lauf des
          # Pipeline-Workflows (auch manuelle), damit nie doppelt angeschoben wird.
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-run.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select((now - (.created_at | fromdateiso8601)) < 10200)] | length')
          echo "Pipeline-Laeufe in den letzten 170 min: ${RECENT}"
          if [ "${RECENT}" -eq 0 ]; then
            echo "Kein Lauf im Fenster — verpasster Cron-Slot wird nachgeholt."
            # --repo ist Pflicht: der Job laeuft ohne Checkout, gh hat kein Git-Kontextverzeichnis (Lauf #1: "not a git repository").
            gh workflow run pipeline-run.yml --ref main --repo "${GITHUB_REPOSITORY}" -f mode=run-small -f watchdog=true
            echo "### Watchdog hat einen verpassten Cron-Slot nachgeholt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Takt in Ordnung — nichts zu tun."
          fi

      - name: "Scale-2k: laeuft nichts und letzter Start aelter als ~2h? Dann neu anstossen."
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ziel: ~2000 Profile/Tag (12 Laeufe x 10 Shards). Heilt zwei bekannte
          # Ausfallbilder: (1) GitHub laesst einen Schedule-Slot ersatzlos ausfallen,
          # (2) der vorherige Lauf endete cancelled (90-min-Timeout) und der naechste
          # Cron-Slot ist noch fern. Neustart bringt nur etwas, wenn LLM-Provider
          # antworten — der Runner bricht bei totalem Provider-Ausfall seit dem
          # Circuit-Breaker schnell und klar sichtbar ab statt Minuten zu verbrennen.
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-scale-2k.yml/runs?per_page=5")
          IN_PROGRESS=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length')
          LAST_START_AGO=$(echo "$RUNS" | jq '[.workflow_runs[] | (now - (.created_at | fromdateiso8601))] | min // 999999')
          LAST_CONCLUSION=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion != null)][0].conclusion // "none"')
          echo "Scale-2k: aktiv=${IN_PROGRESS}, letzter Start vor ${LAST_START_AGO}s, letztes Ergebnis=${LAST_CONCLUSION}"
          if [ "${IN_PROGRESS}" -eq 0 ] && [ "${LAST_START_AGO}" -gt 7800 ]; then
            echo "Kein Scale-2k-Lauf aktiv und letzter Start aelter als 130 min — Neustart."
            gh workflow run pipeline-scale-2k.yml --ref main --repo "${GITHUB_REPOSITORY}"
            {
              echo "### Watchdog hat Scale-2k neu gestartet"
              echo "Vorheriger Lauf: ${LAST_CONCLUSION} — Slot ausgefallen oder Timeout-Cancel."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scale-2k in Ordnung — nichts zu tun."
          fi

      - name: "Auto-Publish: QA-freigegebene Kandidaten regelmaessig live stellen."
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reviewed-Kandidaten wurden bisher nur live, wenn jemand manuell
          # mode=publish-reviewed startete — Scale-2k erzeugte sie, aber niemand
          # publizierte (24.08. gefundene Luecke im '2000/Tag online'-Ziel).
          # Freigabe-Basis: Pauschal-Freigabe Adam King 2026-07-04/17, im
          # Workflow als approved_by-Default smyst247@gmail.com dokumentiert.
          # Das QA-Gate bleibt vollstaendig intakt: publish_profiles publiziert
          # ausschliesslich qa_passed reviewed-Kandidaten; Tagesdeckel 2500 bleibt.
          # Der Modus steht nicht im Run-Namen, sondern im Job-Namen
          # ("Worker-Kette (publish-reviewed)") — deshalb Jobs je Run pruefen.
          RECENT_RUN_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline-run.yml/runs?per_page=15" \
            --jq '.workflow_runs[] | select((now - (.created_at | fromdateiso8601)) < 7200) | .id')
          PUBLISHED_RECENT=0
          for RUN_ID in ${RECENT_RUN_IDS}; do
            JOB_MODE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=5" \
              --jq '[.jobs[].name] | join(" ")' 2>/dev/null || echo "")
            case "${JOB_MODE}" in
              *publish-reviewed*) PUBLISHED_RECENT=1; break ;;
            esac
          done
          echo "Publish-reviewed-Lauf in den letzten 120 min: ${PUBLISHED_RECENT}"
          if [ "${PUBLISHED_RECENT}" -eq 0 ]; then
            echo "Kein Publish im Fenster — publish-reviewed anstossen (approved_by-Default: smyst247@gmail.com)."
            # publish_limit=2500: dokumentierter Betreiber-Deckel (pipeline-run.yml,
            # Anweisung 02.08.2026 'Publish-Deckel 2500/Tag'). Ohne Override gilt
            # der Code-Default daily_publish_limit=5 — der lehnte am 24.08. alle 33
            # QA-bestandenen Kandidaten ab ('Tageslimit erreicht'). QA-Gate bleibt
            # unberuehrt: Nur reviewed+qa_passed wird publiziert.
            gh workflow run pipeline-run.yml --ref main --repo "${GITHUB_REPOSITORY}" \
              -f mode=publish-reviewed -f approved_by=smyst247@gmail.com -f publish_limit=2500
            echo "### Watchdog hat Auto-Publish (publish-reviewed, Deckel 2500/Tag) angestossen" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publish-Takt in Ordnung — nichts zu tun."
          fi
