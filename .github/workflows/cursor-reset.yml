name: Cursor Reset

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund fuer den Reset'
        required: false
        default: 'Cursor nach Duplikat-Saettigung zuruecksetzen'
      start_page:
        description: 'Startseite pro Kategorie (0 = leer, 40+ fuer neue Leute)'
        required: false
        type: number
        default: 0

concurrency:
  group: cursor-reset
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
      IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reset Ingest-Cursor
        working-directory: backend
        run: |
          pip install -q -e ".[dev]"
          python -c "
          import json
          from app.core.config import settings
          import boto3
          s3 = boto3.client(
              's3',
              endpoint_url=settings.idrive_e2_endpoint,
              region_name=settings.idrive_e2_region,
              aws_access_key_id=settings.idrive_e2_access_key,
              aws_secret_access_key=settings.idrive_e2_secret_key,
          )
          KEY = 'pipeline/ingest/cursor.json'
          BUCKET = settings.idrive_e2_bucket
          try:
              old = s3.get_object(Bucket=BUCKET, Key=KEY)
              print(f'ALTER CURSOR: {old[\"Body\"].read().decode()}')
          except Exception:
              print('Kein alter Cursor gefunden.')
          start_page = int('${{ github.event.inputs.start_page || 0 }}')
          CATEGORIES = [
              'Kunst', 'Literatur', 'Musik', 'Wissenschaft', 'Philosophie',
              'Politik', 'Mathematik', 'Medizin', 'Architektur', 'Erfinder',
              'Entdecker', 'Technik', 'Schauspiel', 'Film', 'Gesang',
              'Sport', 'Journalismus', 'Geschichte'
          ]
          cursor = {cat: start_page for cat in CATEGORIES} if start_page > 0 else {}
          print(f'Schreibe Cursor: {cursor}')
          s3.put_object(
              Bucket=BUCKET, Key=KEY,
              Body=json.dumps(cursor).encode(),
              ContentType='application/json'
          )
          resp = s3.get_object(Bucket=BUCKET, Key=KEY)
          data = json.loads(resp['Body'].read().decode())
          expected = cursor if start_page > 0 else {}
          assert data == expected, f'Fehler: Cursor ist {data}'
          print(f'VERIFIZIERT: Cursor ist {data}')
          "
