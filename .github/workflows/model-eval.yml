# Modell-Eval fuer smyst 1.0: stellt das eingefrorene Fragenset den Live-Twins
# und bewertet die Antworten per LLM-as-Judge.
#
# Warum als Workflow und nicht lokal: die Twin-Kapseln liegen in IDrive e2, und
# der LLM-Zugang kommt ueber das CI-Gateway (OIDC) — beides existiert nur hier,
# nicht auf einem Entwicklerrechner.
#
# Der erste Lauf mit tag=baseline ist der Massstab, den ein eigenes Modell
# spaeter schlagen muss. Danach laeuft derselbe Workflow pro Trainings-
# Checkpoint gegen dieselben, NIE veraenderten Fragen.
#
# Taeglicher Rhythmus (seit 2026-08-20): der Schedule-Lauf um 02:30 UTC
# zaehlt zuerst die neuen Trainingsdaten (Export-Worker, nur --dry-run,
# keine LLM-Calls) und misst dann den Live-Stand auf Eval-Set v2 (tag=daily).
# Damit entsteht die Trendkurve, an der sich spaetere smyst-1.x-Promotion
# orientiert (siehe training/README.md, "Ziel & Versionsstrategie").
name: Modell-Eval (smyst 1.0 Baseline & Checkpoints)

on:
  schedule:
    # 02:30 UTC = 04:30 Berlin — vor dem ersten Pipeline-Lauf des Tages.
    # Frueh nach Groq-TPD-Reset (00:00 UTC) und vor den Hauptverbrauchern
    # (Quality-Loop 05:47 UTC, Scale-2k erst 02:00 mit eigenem Modell).
    # Frueher 02:30-Uhr-Slot scheiterte taeglich: Kontingent war bereits
    # vom Nachtbetrieb aufgebraucht, Twin antwortete aus dem Not-Fallback.
    - cron: "40 0 * * *"
  workflow_dispatch:
    inputs:
      eval_set:
        description: "Pfad zum Eval-Set (relativ zu backend/)"
        required: false
        default: "../training/eval/smyst-eval-v1.jsonl"
      tag:
        description: "Label des Laufs (baseline, checkpoint-1000, ...)"
        required: false
        default: "baseline"
      limit:
        description: "Nur die ersten N Fragen (leer = alle)"
        required: false
        default: ""
      dry_run:
        description: "Nur Twin-Aufloesung pruefen, keine LLM-Calls"
        required: false
        default: "false"

concurrency:
  group: model-eval
  cancel-in-progress: false

jobs:
  eval:
    # Schedule-Laefe haben leere inputs -> per || auf Tagesdefaults fallen.
    name: Eval-Lauf (${{ inputs.tag || 'daily' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # id-token:write laesst den Job ein OIDC-Token anfordern — damit weist
      # sich der Eval beim CI-LLM-Gateway aus (kein Provider-Key noetig).
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev]"

      # Schritt 1 des taeglichen Rhythmus: wie viel neue Trainingsdaten sind
      # seit gestern dazu gekommen? Nur Zaehlung (dry-run), keine LLM-Calls,
      # nichts wird geschrieben. Das ist der Trigger-Messer fuer den
      # automatischen GPU-Trainingslauf (Schwellen siehe training/README.md).
      - name: Trainingsdaten-Zaehlung (dry-run)
        if: github.event_name == 'schedule'
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
        run: |
          set -o pipefail
          {
            echo "## Trainingsdaten-Zuwachs (Zaehlung)"
            echo ""
            echo "### Chat-Archive -> SFT/Praeferenz"
            echo '```'
            python -m app.workers.export_training_data --dry-run 2>&1 | tee /tmp/sft-count.txt
            echo '```'
            echo "### QA-Urteile (Pipeline)"
            echo '```'
            python -m app.workers.export_qa_judgments --dry-run 2>&1 | tee /tmp/qa-count.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Eval-Lauf
        id: eval_run
        env:
          IDRIVE_E2_ACCESS_KEY: ${{ secrets.IDRIVE_E2_ACCESS_KEY }}
          IDRIVE_E2_SECRET_KEY: ${{ secrets.IDRIVE_E2_SECRET_KEY }}
          # Gateway zuerst: es leiht sich die funktionierende Provider-Kette des
          # Servers. Die Einzel-Keys bleiben als Rueckfallebene dahinter.
          LLM_PROVIDER_ORDER: "groq,smyst_llm,smyst_gateway"
          SMYST_GATEWAY_BASE_URL: "https://api.smyst.com/api/ci/llm"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ARGS="--eval-set ${{ inputs.eval_set || '../training/eval/smyst-eval-v2.jsonl' }} --tag ${{ inputs.tag || 'daily' }} --out ../eval-report"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Ausgabe doppelt verwenden: Konsole fuer die Log-Suche, Datei fuer die
          # Zusammenfassung. set -o pipefail, damit ein Eval-Fehler den Job
          # rot macht statt still durch tee zu verschwinden.
          set -o pipefail
          # Erster Versuch; bei Fehlschlag einmal 60 Minuten warten und
          # wiederholen (transiente Erschoepfung des Groq-Tageslimits).
          if python -m app.workers.run_model_eval $ARGS | tee /tmp/eval-out.txt; then
            echo "attempt=1-ok" >> "$GITHUB_OUTPUT"
          else
            echo "Erster Versuch fehlgeschlagen — retry in 60 min." >&2
            sleep 3600
            python -m app.workers.run_model_eval $ARGS | tee /tmp/eval-out.txt
            echo "attempt=2-ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Modell-Eval: ${{ inputs.tag || 'daily' }}"
            echo ""
            echo '```'
            tail -n 20 /tmp/eval-out.txt 2>/dev/null || echo "keine Ausgabe"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Der Report enthaelt die Twin-Antworten im Klartext — als Artefakt
      # abgelegt (30 Tage), NICHT ins Repo. Dauerhaft liegt er in e2 unter
      # training-evals/.
      - name: Report als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ inputs.tag || 'daily' }}
          path: eval-report/
          if-no-files-found: warn
          retention-days: 30
